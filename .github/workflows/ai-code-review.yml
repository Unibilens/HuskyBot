name: "AI Code Review"

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR Numarası (örn: 25)'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    name: "Gemini PR Review"
    # Sadece PR altındaki yorumlarda /review veya /ai-review yazıldığında ya da manuel tetiklendiğinde çalışır
    if: |
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        (startsWith(github.event.comment.body, '/review') || startsWith(github.event.comment.body, '/ai-review')) &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
      ) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: React Eyes to comment
        if: github.event_name == 'issue_comment'
        run: |
          gh api "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" -f content='eyes' || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine PR Number
        id: pr
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "number=${{ inputs.pr_number }}" >> $GITHUB_OUTPUT
          else
            echo "number=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT
          fi

      - name: Generate AI Review with Gemini
        run: node .github/scripts/ai-review.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          COMMENT_BODY: ${{ github.event.comment.body || '/review' }}
          MODEL: "gemini-2.5-flash"

      - name: Post Review Comment to PR
        run: |
          gh pr comment ${{ steps.pr.outputs.number }} --body-file review.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: React Rocket to comment
        if: github.event_name == 'issue_comment'
        run: |
          gh api "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" -f content='rocket' || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
